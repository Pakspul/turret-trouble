name: Deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Set this to the name of your Azure Web App.
  AZURE_WEBAPP_NAME: turret-trouble
  NODE_VERSION: '20.x'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No dependencies to install - the server is zero-dep and the game is
      # plain ES modules, so these steps just fail the build on a broken
      # commit rather than deploying one.
      - name: Syntax check
        run: npm run check

      - name: Smoke test
        run: npm test

      - name: Package
        run: |
          zip -r release.zip . \
            -x '*.git*' -x 'archive/*' -x 'test/*' -x 'node_modules/*' -x 'release.zip'

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
